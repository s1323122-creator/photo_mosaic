
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォトモザイク</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>フォトモザイク</h1>
    <p class="message">マスをタップして写真を集めよう！</p>

    <div class="grid" id="photoGrid">
      <button class="cell" data-index="0" aria-label="1マス目"></button>
      <button class="cell" data-index="1" aria-label="2マス目"></button>
      <button class="cell" data-index="2" aria-label="3マス目"></button>
      <button class="cell" data-index="3" aria-label="4マス目"></button>
      <button class="cell" data-index="4" aria-label="5マス目"></button>
      <button class="cell" data-index="5" aria-label="6マス目"></button>
      <button class="cell" data-index="6" aria-label="7マス目"></button>
      <button class="cell" data-index="7" aria-label="8マス目"></button>
      <button class="cell" data-index="8" aria-label="9マス目"></button>
    </div>

    <div class="buttons">
      <button id="completeBtn" type="button">完成</button>
      <button id="resetBtn" type="button">初めから</button>
    </div>

    <p id="status" class="status">写真を9枚集めて作品を完成させよう</p>
    
    <section id="cameraModal" class="camera-modal" hidden>
      <div class="camera-panel">
        <h2>写真を撮ろう</h2>

        <div class="camera-view">
            <video id="cameraPreview" autoplay playsinline></video>
            <div id="cameraGuide" class="camera-guide"></div>
        </div>


        <p id="cameraMessage">カメラを準備しています...</p>

        <div class="camera-buttons">
          <button id="takePhotoBtn" type="button">撮影する</button>
          <button id="cancelCameraBtn" type="button">キャンセル</button>
        </div>
      </div>
    </section>

    <canvas id="photoCanvas" hidden></canvas>

  </main>

  <script src="script.js"></script>
</body>
</html>
